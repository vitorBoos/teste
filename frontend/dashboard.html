<!doctype html>
<html>
<head>
    <link rel="stylesheet" href="theme.css">
    <title>Dashboard - PetShop</title>
</head>
<body>
    <nav style="padding: 20px; border-bottom: 1px solid var(--border); background: var(--surface)">
        <div class="container flex justify-between">
            <strong>PetShop System</strong>
            <div class="flex">
                <a href="users.html" class="btn" style="background: transparent; color: var(--fg); border: 1px solid var(--border)">Users</a>
                <a href="pets.html" class="btn">Pets</a>
                <a href="clients.html" class="btn" style="background: transparent; color: var(--fg); border: 1px solid var(--border)">Clients</a>
            </div>
        </div>
    </nav>
    <div class="container" style="padding-top: 40px;">
        <div class="card" style="text-align: center;">
            <h1 style="margin-bottom: 0;">PetShop System Management</h1>
            <p style="color: var(--muted); margin-bottom: 2rem;">Making pet care simpler, one tail wag at a time.</p>
            <img src="./dog-image.jpg" alt="Happy Dog" style="max-width: 80%; border-radius: 12px; height: auto; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">
        </div>
    </div>
</body>
</html>
