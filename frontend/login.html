<!doctype html>
<html>
<head>
    <link rel="stylesheet" href="theme.css">
    <title>Login - PetShop</title>
</head>
<body>
    <div id="root" class="container"></div>
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
    <script type="text/babel">
      function Login() {
        const [email, setEmail] = React.useState('');
        const [password, setPassword] = React.useState('');
        const handleLogin = async () => {
          const res = await fetch('http://localhost:3000/api/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email, password})
          });
          if (res.ok) window.location.href = 'dashboard.html';
          else alert('Login failed');
        };
        return (
          <div style={{display: 'flex', justifyContent: 'center', alignItems: 'center', minHeight: '80vh'}}>
            <div className="card" style={{width: '100%', maxWidth: '400px'}}>
                <h1 style={{marginTop: '0'}}>PetShop Login</h1>
                <div style={{marginBottom: '15px'}}>
                    <label>Email</label>
                    <input type="email" placeholder="admin@petshop.com" className="input" onChange={e => setEmail(e.target.value)} />
                </div>
                <div style={{marginBottom: '15px'}}>
                    <label>Password</label>
                    <input type="password" placeholder="password" className="input" onChange={e => setPassword(e.target.value)} />
                </div>
                <button className="btn" style={{width: '100%'}} onClick={handleLogin}>Entrar</button>
            </div>
          </div>
        );
      }
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<Login />);
    </script>
</body>
</html>
